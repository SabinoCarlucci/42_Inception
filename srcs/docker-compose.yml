
services:
  mariadb:
    build: 
      context: requirements/mariadb
    image: mariadb:inception #custom tag to avoid latest
    container_name: mariadb
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    restart: always

  wordpress:
    build:
      context: requirements/wordpress
    image: wordpress:inception #custom tag to avoid latest
    container_name: wordpress
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - mariadb
    restart: always

  # nginx:
  #   build: ./requirements/nginx
  #   container_name: nginx
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - /home/scarlucc/data/wordpress:/var/www/html
  #   networks:
  #     - inception_network
  #   depends_on:
  #     - wordpress
  #   restart: always

networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  